server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version del servidor.
    server_tokens off;

    # Cabeceras de seguridad. Varias de ellas son justamente lo que revisa
    # OWASP ZAP en el control de analisis dinamico.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src *" always;

    # La aplicacion es una SPA de Angular: cualquier ruta desconocida
    # debe devolver index.html para que el enrutador del cliente la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker no debe quedar cacheado por el navegador.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }

    # Los artefactos con hash en el nombre pueden cachearse por largo tiempo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
