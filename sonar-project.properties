# Configuracion del analisis de SonarQube para road-to-fire.
# La puerta de calidad se define en el servidor, no aqui: este archivo solo
# indica que se analiza y donde estan los reportes.

sonar.projectKey=road-to-fire
sonar.projectName=Road to FIRE
sonar.projectVersion=1.5.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,e2e/**

sonar.sourceEncoding=UTF-8

# Cobertura producida por karma-coverage en el job de construccion.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Definicion de codigo nuevo. La puerta de calidad evalua solo lo que cambia
# respecto de esta referencia, que es lo que permite aplicar un criterio
# bloqueante sobre un repositorio que arrastra deuda anterior.
sonar.newCode.referenceBranch=master
