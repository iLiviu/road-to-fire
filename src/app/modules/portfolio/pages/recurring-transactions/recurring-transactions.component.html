<app-top-toolbar pageTitle="Scheduled Transactions">
  <button type="button" aria-label="Filter Transactions" mat-icon-button matTooltip="Filter Transactions"
    (click)="showFilterDialog()">
    <mat-icon>filter_list</mat-icon>
  </button>

  <app-notifications-button></app-notifications-button>
</app-top-toolbar>

<div class="page-content portfolio-page-content">
  <div class="portfolio-page-wrapper">
    <app-recurring-transactions-list [transactions]="transactions" [forexRates]="forexRates" [baseCurrency]="baseCurrency"
      [dataLoaded]="transactionsLoaded">
    </app-recurring-transactions-list>
  </div>
</div>
